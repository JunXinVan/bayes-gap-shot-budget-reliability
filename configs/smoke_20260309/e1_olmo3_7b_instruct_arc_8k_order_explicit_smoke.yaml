run:
  name: e1_olmo3_7b_instruct_arc_8k_order_explicit_smoke
  seed: 123
  output_dir: results_smoke_20260309

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/allenai/Olmo-3-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 2

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 8k
    max_examples: 2
    candidates: ["A", "B", "C", "D"]

prompt:
  system: "You are answering a 4-option multiple-choice science question. The earlier question-answer pairs are demonstrations of format only. For the final question, answer with exactly one option: A, B, C, or D."
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2]
  max_demos: 2

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 2

cache:
  enabled: false

scoring:
  batch_size: 2

plot:
  enabled: false
