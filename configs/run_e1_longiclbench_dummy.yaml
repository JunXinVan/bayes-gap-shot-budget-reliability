run:
  name: e1_longiclbench_dummy_goemotion
  seed: 123
  output_dir: results

model:
  backend: dummy
  dummy:
    num_candidates: 28

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: GoEmotion
    max_examples: 3
    rounds: [1, 2, 3, 4, 5]
    batch_size: 1

# NOTE: LongICLBench provides pre-built prompts per round.
# The template is only used for perturbations like pad-shift (query_prefix must match).
prompt:
  system: ""
  query_prefix: "comment: "

grid:
  k_values: [1, 2, 3, 4, 5]
  max_demos: 5

perturbations:
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32]

plot:
  enabled: false

