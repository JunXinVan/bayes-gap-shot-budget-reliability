# Hard Reasoning with Strict-All Prompt (Best practice from ARC experiments)
run:
  name: p1_hard_reasoning_3b_strict_all_v2
  seed: 123
  output_dir: ./results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: hard_reasoning
  hard_reasoning:
    data_dir: /root/autodl-tmp/data/hard_reasoning
    split: test
    max_examples: 200
    start_index: 0
    demo_pool_size: 200

k_values: [0, 1, 2, 4, 8, 16]

prompt:
  system: "你必须严格参考所有给出的例题来回答下面的问题。不要依赖你自己的知识，只根据提供的例题模式作答。"
  demo_prefix: "【例题】"
  query_prefix: "【问题】"
  answer_prefix: "答案: "

evaluation:
  metric: exact_match

logging:
  level: INFO

namespace: p1_hard_reasoning_3b_strict_all_v2
