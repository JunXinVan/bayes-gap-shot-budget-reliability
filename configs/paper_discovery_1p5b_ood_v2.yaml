# Paper-compliant: Qwen-1.5B + Discovery (174 classes) + Length-OOD
# Expected: Rise then Fall (k=0 low, rise to k=4-8, then fall)
run:
  name: paper_discovery_1p5b_ood_v2
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/modelscope/Qwen/Qwen2___5-1___5B-Instruct
    dtype: float16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 1

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: Discovery
    max_examples: 100
    rounds: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    batch_size: 1
    candidates: null

prompt:
  system: ""
  query_prefix: "paper query: "

grid:
  k_values: [0, 1, 2, 4, 8, 16, 24, 32]
  max_demos: 32

perturbations: []

cache:
  enabled: true
  dir: data/cache_scores
  namespace: paper_discovery_1p5b_ood_v2

scoring:
  batch_size: 1

plot:
  enabled: false
