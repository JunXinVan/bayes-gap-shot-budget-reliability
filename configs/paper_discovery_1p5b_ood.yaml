# Paper-compliant: Qwen-1.5B + Discovery (174 classes) + Length-OOD
# Expected: Rise then Fall (k=0 low, rise to k=4-8, then fall)
run:
  name: paper_discovery_1p5b_ood
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/modelscope/Qwen/Qwen2___5-1___5B-Instruct
    dtype: float16  # Use float16 for 1.5B stability
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 1  # Increase noise, prevent smoothing

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: Discovery  # 174 labels - large label space prevents recovery
    max_examples: 100  # More samples for statistical stability
    rounds: [0, 1, 2, 3, 4, 5, 6, 7, 8]  # k=0 to k=8
    batch_size: 1
    candidates: null  # Auto-extract 174 candidates

prompt:
  system: ""
  query_prefix: "paper query: "

grid:
  # Length-OOD: train on k<=8, test beyond
  k_values: [0, 1, 2, 4, 8, 16, 24, 32]
  max_demos: 32

# NO position_lock - ensure position shift continues
position_lock:
  enabled: false

perturbations: []

cache:
  enabled: true
  dir: data/cache_scores
  namespace: paper_discovery_1p5b_ood

scoring:
  batch_size: 1  # Increase noise

plot:
  enabled: true
