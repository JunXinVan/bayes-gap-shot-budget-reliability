run:
  name: e5_local_debug_opnorm_gpt2
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: gpt2
    dtype: float32
    device: auto
    trust_remote_code: false
    use_chat_template: false
    add_generation_prompt: false

certificates:
  opnorm:
    enabled: true
    num_iter: 20
    seed: 123
    out_dir: results/certificates
    dtype: float32
