run:
  name: e1_qwen2p5_3b_longiclbench_banking77_template_seed0_50
  seed: 123
  output_dir: results
model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 32
task:
  backend: longiclbench
  longiclbench:
    dataset_name: launch/LongICLBench
    split: BANKING77
    rounds:
    - 1
    - 2
    - 3
    - 4
    - 5
    max_examples: 50
prompt:
  system: ''
  demo_prefix: 'Query: '
  query_prefix: 'Query: '
  answer_prefix: 'Intent: '
grid:
  k_values:
  - 0
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 48
  - 64
  max_demos: 64
perturbations:
- kind: template_replace
  template_replacements:
    'Query:':
    - 'Input:'
    - 'User query:'
    - 'Customer says:'
    'Intent:':
    - 'Category:'
    - 'Label:'
    - 'Type:'
cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_3b_longiclbench_banking77
scoring:
  batch_size: 32
plot:
  enabled: true
