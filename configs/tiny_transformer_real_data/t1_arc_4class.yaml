# Tiny Transformer on REAL ARC-Challenge Dataset (4-class)
# Model: 37K params, 2 layers
# Data: Real ARC-Challenge (NOT synthetic)

name: tt_real_arc_4class_order

model:
  type: tiny_transformer
  d_model: 32
  n_layers: 2
  n_heads: 2
  vocab_size: 1000  # For real text data
  max_len: 512
  dropout: 0.1

dataset:
  name: arc_challenge
  type: real
  n_classes: 4
  candidates: ["A", "B", "C", "D"]
  max_examples: 200
  seed: 42

training:
  train_k: 4
  n_epochs: 50
  batch_size: 16
  lr: 0.001
  warmup_steps: 100

evaluation:
  test_k_values: [0, 1, 2, 4, 8, 16]
  n_test_samples: 200
  batch_size: 16

selection:
  rules: [entropy_only, fixed_k]
  
output_dir: results/tiny_transformer_real
