run:
  name: e1_qwen2p5_7b_longiclbench_banking77
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/modelscope/Qwen/Qwen2.5-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: BANKING77  # 77 labels - larger label space
    max_examples: 100  # Smaller due to larger label space
    rounds: [1, 2, 3, 4, 5]
    batch_size: 1

prompt:
  system: ""
  query_prefix: "service query: "

grid:
  k_values: [1, 2, 3, 4, 5]  # LongICLBench uses rounds
  max_demos: 5

perturbations:
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32, 128, 512]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_7b_longiclbench_banking77

scoring:
  batch_size: 8  # Larger batch for more candidates

plot:
  enabled: true
