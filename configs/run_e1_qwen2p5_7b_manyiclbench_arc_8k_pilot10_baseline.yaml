run:
  name: e1_qwen2p5_7b_manyiclbench_arc_8k_pilot10_pad_baseline
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: Qwen/Qwen2.5-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false
    batch_size: 2

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 8k
    max_examples: 10
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16, 32]
  max_demos: 32

perturbations:
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32, 128, 512]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_7b_manyiclbench_arc_8k

plot:
  enabled: false

