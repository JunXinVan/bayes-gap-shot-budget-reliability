run:
  name: e1_olmo3_7b_instruct_arc_8k_order_full200_explicit_preamble_strict_seed2
  seed: 2
  output_dir: results_rerun_v61_20260303

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/allenai/Olmo-3-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 8

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed2
    prefix_key: 8k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  query_preamble: 'Choose exactly one option from {A, B, C, D}. Reply with the option letter only.'
  query_instruction: ""
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 4

cache:
  enabled: true
  dir: data/cache_scores_rerun_v61_20260303
  namespace: olmo3_7b_instruct_arc_8k_order_explicit_preamble_strict_rerun20260310_seed2

scoring:
  batch_size: 8

plot:
  enabled: true

