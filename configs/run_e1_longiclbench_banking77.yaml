run:
  name: e1_curves_longiclbench_banking77
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: meta-llama/Llama-3.1-8B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: BANKING77
    max_examples: 100
    rounds: [1, 2, 3, 4, 5]
    batch_size: 1

# LongICLBench ships pre-built prompts; template is only used for pad-shift.
prompt:
  system: ""
  query_prefix: "service query: "

grid:
  k_values: [1, 2, 3, 4, 5]
  max_demos: 5

perturbations:
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32, 128, 512]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: llama31_8b_longiclbench_banking77

scoring:
  batch_size: 4

plot:
  enabled: true

