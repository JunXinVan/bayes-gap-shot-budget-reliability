run:
  name: e1_curves
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: meta-llama/Llama-3.1-8B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 8k
    max_examples: 200

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16, 32]
  max_demos: 32

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 4
    seed: 999
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32, 128]

drift:
  enabled: false

scoring:
  batch_size: 4

plot:
  enabled: true
