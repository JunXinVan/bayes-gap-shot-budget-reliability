# Quick test: Qwen-1.5B + Discovery (174 classes) + 20 examples
# Note: LongICLBench rounds start from 1, not 0
# Note: Discovery only has 1-5 Round Prompts
run:
  name: discovery_1p5b_quick
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/modelscope/Qwen/Qwen2___5-1___5B-Instruct
    dtype: float16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 1

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: Discovery
    max_examples: 20
    # Discovery only has rounds 1-5
    rounds: [1, 2, 3, 4, 5]
    batch_size: 1
    candidates: null

prompt:
  system: ""
  query_prefix: ""

grid:
  # k=0: zero-shot (constructed from 1 Round by removing demos)
  # k=1,2,3,4,5: use pre-built prompts
  # Use only available rounds
  k_values: [0, 1, 2, 3, 4, 5]
  max_demos: 5

perturbations: []

cache:
  enabled: true
  dir: data/cache_scores
  namespace: discovery_1p5b_quick

scoring:
  batch_size: 1

plot:
  enabled: false
