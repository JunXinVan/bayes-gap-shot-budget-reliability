run:
  name: e5_opnorm
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: meta-llama/Llama-3.1-8B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false

certificates:
  opnorm:
    enabled: true
    num_iter: 50
    seed: 123
    out_dir: results/certificates
    # device: cuda
    dtype: float32

