run:
  name: e2_qwen2p5_3b_arc_8k_pad_full200_position_lock_v2
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 16

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 8k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

position_lock:
  enabled: true

grid:
  k_values: [0, 1, 2, 4, 8, 16, 32]
  max_demos: 32

selection:
  lambda: 0.5
  policy: bg_only
  metrics: ["entropy", "bg_disagree"]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_3b_arc_8k_poslock_v2

scoring:
  batch_size: 16

plot:
  enabled: true
