# 替换 BANKING77 的实验配置
# 原：77类 - 太难，模型无法学习
# 新：10类 - 适中难度，可展示scalability

run_id: "tt_10class_template"
priority: "P1"
paper_ref: "Paper-E2"
goal: "10-class classification (replacement for BANKING77) - scalable difficulty"
model: "d32_L2_h2"
train_k: 4
test_k: [0, 1, 2, 4, 8]
task:
  type: "multiclass"
  n_classes: 10  # 从77降到10
  vocab_size: 100
perturb_family: "template"
n_train_samples: 2000
n_epochs: 40
