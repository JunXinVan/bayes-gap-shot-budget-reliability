run:
  name: e1_qwen2p5_1p5b_manyiclbench_arc_8k_chunk_100_50_local
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: Qwen/Qwen2.5-1.5B-Instruct
    dtype: float16
    device: auto
    trust_remote_code: false
    batch_size: 4

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 8k
    start_index: 100
    max_examples: 50
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16, 32]
  max_demos: 32

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 2
    seed: 999
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32, 128]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_1p5b_manyiclbench_arc_8k

plot:
  enabled: true

