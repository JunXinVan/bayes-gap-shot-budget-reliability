run:
  name: e1_olmo3_7b_instruct_arc_8k_order_full200_explicit_seed1
  seed: 1
  output_dir: results_rerun_v61_20260303

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/allenai/Olmo-3-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 8

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed1
    prefix_key: 8k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: "You are answering a 4-option multiple-choice science question. The earlier question-answer pairs are demonstrations of format only. For the final question, answer with exactly one option: A, B, C, or D."
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 4

cache:
  enabled: true
  dir: data/cache_scores_rerun_v61_20260303
  namespace: olmo3_7b_instruct_arc_8k_order_explicit_rerun20260309_seed1

scoring:
  batch_size: 8

plot:
  enabled: true
