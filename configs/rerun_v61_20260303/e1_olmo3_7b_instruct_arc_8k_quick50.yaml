# OLMo-3 Instruct quick check (model selection): ARC-Challenge, 8k template, small n + small k-grid.
run:
  name: e1_olmo3_7b_instruct_arc_8k_quick50
  seed: 123
  output_dir: results_rerun_v61_20260303

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/allenai/Olmo-3-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: false
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 8k
    max_examples: 50
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 4, 16]
  max_demos: 16

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 1
    seed: 999

cache:
  enabled: true
  dir: data/cache_scores
  namespace: olmo3_instruct_arc_8k_quick50

scoring:
  batch_size: 4

plot:
  enabled: false

