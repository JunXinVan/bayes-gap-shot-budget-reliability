# P5: ARC with no system prompt (minimal)
run:
  name: p5_arc_3b_no_system
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 1k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: ""
  query_prefix: ""
  answer_prefix: ""

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

perturbations: []

cache:
  enabled: true
  dir: data/cache_scores
  namespace: p5_arc_3b_no_system

scoring:
  batch_size: 4

plot:
  enabled: false
