# T5: Long Training - train on k<=16 (more in-context examples during training)
name: t5_long_train
d_model: 64
n_layers: 2
n_heads: 2
vocab_size: 100
max_len: 200

train_k: 16
n_train_samples: 1000
n_epochs: 30
batch_size: 50
lr: 0.001

test_k_values: [0, 1, 2, 4, 8, 12, 16, 24, 32, 48, 64]
n_test_samples: 200

output_dir: results/toy_transformer
