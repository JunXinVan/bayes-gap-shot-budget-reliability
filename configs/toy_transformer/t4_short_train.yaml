# T4: Short Training - train on k<=4 (less in-context examples during training)
name: t4_short_train
d_model: 64
n_layers: 2
n_heads: 2
vocab_size: 100
max_len: 130

train_k: 4
n_train_samples: 1000
n_epochs: 30
batch_size: 50
lr: 0.001

test_k_values: [0, 1, 2, 4, 8, 12, 16, 24, 32, 48, 64]
n_test_samples: 200

output_dir: results/toy_transformer
