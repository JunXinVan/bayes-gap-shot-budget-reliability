run:
  name: e2_qwen2p5_7b_manyiclbench_arc_1k_order_full200
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/modelscope/Qwen/Qwen2.5-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 1k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

# E2: Selection / Stop rules
selection:
  enabled: true
  lambda_values: [0.0, 0.1, 0.3, 0.5, 1.0]

stop:
  enabled: true
  danger:
    enabled: true
    entropy_drop_threshold: 0.05
    bg_growth_threshold: 0.02
  fixed_k:
    enabled: true
    k_values: [4, 8, 16]

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 4
    seed: 999

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_7b_manyiclbench_arc_1k

scoring:
  batch_size: 4

plot:
  enabled: true
