run:
  name: e1_qwen2p5_3b_arc_strict_all
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 1k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: "你必须严格参考所有给出的例题来回答下面的问题。不要依赖你自己的知识，只根据提供的例题模式作答。"
  demo_prefix: "【例题】"
  query_prefix: "【问题】"
  answer_prefix: "答案: "

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

perturbations: []

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_3b_arc_strict_all

scoring:
  batch_size: 4

plot:
  enabled: false
