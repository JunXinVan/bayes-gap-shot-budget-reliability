run:
  name: e2_qwen2p5_3b_arc_1k_order_full200
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 4

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Challenge
    split: seed0
    prefix_key: 1k
    max_examples: 200
    candidates: ["A", "B", "C", "D"]

prompt:
  system: ""
  demo_prefix: "Question: "
  query_prefix: "Question: "
  answer_prefix: "Answer: "

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

selection:
  # E2: selection/stop规则评估
  lambda: 0.5  # H + lambda * BG
  policy: bg_only  # 可选: oracle, bg_only, acc_proxy
  metrics: ["entropy", "bg_disagree"]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_3b_arc_1k  # 复用E1的cache

scoring:
  batch_size: 4

plot:
  enabled: true
