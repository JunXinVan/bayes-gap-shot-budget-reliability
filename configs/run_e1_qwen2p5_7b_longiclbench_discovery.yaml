run:
  name: e1_qwen2p5_7b_longiclbench_discovery
  seed: 123
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/modelscope/Qwen/Qwen2.5-7B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 2  # Smaller batch due to 174 labels

task:
  backend: longiclbench
  longiclbench:
    dataset_name: TIGER-Lab/LongICLBench
    split: Discovery  # 174 labels - very large label space
    max_examples: 50  # Even smaller due to very large label space
    rounds: [1, 2, 3, 4, 5]
    batch_size: 1

prompt:
  system: ""
  query_prefix: "paper query: "

grid:
  k_values: [1, 2, 3, 4, 5]
  max_demos: 5

perturbations:
  - kind: pad_shift
    pad_token: "\n"
    pad_lengths: [32, 128]

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_7b_longiclbench_discovery

scoring:
  batch_size: 4

plot:
  enabled: true
