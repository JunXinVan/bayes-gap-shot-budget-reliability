# Pilot multi-seed (ManyICLBench official seed split): ARC-Easy seed2
run:
  name: e1_qwen2p5_3b_manyiclbench_arc_easy_order_fast20_seed2
  seed: 2
  output_dir: results

model:
  backend: hf
  hf:
    model_name: /root/autodl-tmp/hf_cache/models/Qwen/Qwen2___5-3B-Instruct
    dtype: bfloat16
    device: auto
    trust_remote_code: true
    use_chat_template: true
    add_generation_prompt: true
    batch_size: 32

task:
  backend: manyiclbench
  manyiclbench:
    dataset_name: launch/ManyICLBench
    task_name: ARC-Easy
    split: seed2
    prefix_key: 1k
    max_examples: 200
    data_fraction: 0.2

prompt:
  system: ''

grid:
  k_values: [0, 1, 2, 4, 8, 16]
  max_demos: 16

perturbations:
  - kind: reverse_order
  - kind: shuffle
    num_samples: 4
    seed: 999

cache:
  enabled: true
  dir: data/cache_scores
  namespace: qwen2p5_3b_arc_easy_fast20

scoring:
  batch_size: 32

plot:
  enabled: true

