[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overprompting-exp"
version = "0.1.0"
description = "Experiment scaffold for overprompting as Bayes-gap growth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
plot = [
  "matplotlib>=3.7",
  "pandas>=2.0",
]
hf = [
  "torch>=2.2",
  "transformers>=4.46",
  "accelerate>=0.33",
]
datasets = [
  "datasets>=2.18",
]
vllm = [
  "vllm>=0.6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

